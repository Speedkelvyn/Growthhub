<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus & Growth</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--line:#cbd5e1;--text:#0f172a;--mute:#64748b;--acc:#4f46e5;--acc2:#6366f1;--ok:#059669;--warn:#d97706;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--line:#334155;--text:#f8fafc;--mute:#94a3b8;--acc:#6366f1;--acc2:#818cf8;--ok:#10b981;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--line:#334155;--text:#f8fafc;--mute:#94a3b8;--acc:#6366f1;--acc2:#818cf8;--ok:#10b981;--warn:#fbbf24}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 16px 12px}
.wrap{max-width:460px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.date{font-size:13px;color:var(--mute);margin-top:2px}
.clock{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc2);text-align:right}
.tabs{display:flex;background:var(--card);padding:4px;border-radius:12px;margin-top:12px;border:1px solid var(--line)}
.tabs button{flex:1;padding:8px;border:0;border-radius:9px;background:none;color:var(--mute);font:600 14px inherit;font-family:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
main{padding:20px 16px}
section{display:none}section.on{display:block}
.now{background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:14px;margin-bottom:22px}
.now b{display:block;font-size:17px;margin:2px 0}
.now small{color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc2);width:0;transition:width .4s}
ol{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.it{position:relative;padding:0 0 20px 22px;display:flex;gap:12px;align-items:flex-start}
.it::before{content:"";position:absolute;left:-10px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--mute);border:2px solid var(--bg)}
.it.focus::before{background:var(--acc)}.it.rest::before{background:var(--ok)}
.it.cur::before{width:18px;height:18px;left:-12px;top:1px;background:var(--acc2);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc2) 30%,transparent)}
.it.past .tx{opacity:.5}
.tm{font-size:12px;font-weight:700;color:var(--acc2);letter-spacing:.03em}
.tt{font-size:16px;font-weight:500;margin:1px 0}
.tn{font-size:13px;color:var(--mute);line-height:1.45}
.tx{flex:1}
.badge{font-size:11px;font-weight:700;background:var(--acc);color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px}
.ck,.wk{appearance:none;width:24px;height:24px;flex:none;border:2px solid var(--line);background:var(--card);border-radius:8px;display:grid;place-content:center;cursor:pointer;margin:0}
.ck:checked,.wk:checked{background:var(--ok);border-color:var(--ok)}
.ck:checked::after,.wk:checked::after{content:"";width:12px;height:12px;background:#fff;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0,43% 62%)}
.sum{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.panel label{font-size:13px;color:var(--mute);display:block;margin-bottom:6px}
.panel input[type=date]{width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;color-scheme:light dark}
.wl{display:flex;flex-direction:column;gap:12px;margin-top:14px}

details{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details[open]{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2)}
summary{padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;list-style:none;user-select:none}
summary::-webkit-details-marker{display:none}
.sum-left{flex:1}.sum-left h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.sum-left p{margin:4px 0 0;font-size:13px;color:var(--mute);line-height:1.4}
.sum-right{font-size:13px;font-weight:600;color:var(--acc2);text-align:right;margin-left:10px;white-space:nowrap}
.sum-right span{display:block;font-size:11px;color:var(--mute);font-weight:400;margin-top:2px}
.day-list{padding:0 14px 14px;border-top:1px solid var(--line);background:var(--bg)}
.day-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.day-item:last-child{border-bottom:0;padding-bottom:0}
.day-text{flex:1;font-size:13px;line-height:1.4;color:var(--mute)}
.day-text b{color:var(--text);font-size:14px;display:block;margin-bottom:2px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;color:#fff}
.w-done summary{opacity:.7}.w-done h3{text-decoration:line-through}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="top"><div><h1>Focus & Growth</h1><div class="date" id="date"></div></div><div class="clock" id="clock"></div></div>
 <div class="tabs" role="tablist">
  <button role="tab" id="t-routine" aria-selected="true" onclick="tab('routine')">Daily Routine</button>
  <button role="tab" id="t-plan" aria-selected="false" onclick="tab('plan')">10-Week Plan</button>
 </div>
</div></header>
<main class="wrap">
 <section id="routine" class="on">
  <div class="now" id="now"></div>
  <div class="sum"><span>Today's checklist</span><span id="dcount"></span></div>
  <ol id="tl"></ol>
 </section>
 <section id="plan">
  <div class="panel">
   <label for="start">Sprint start date</label>
   <input type="date" id="start">
   <div class="bar"><i id="pbar"></i></div>
   <div class="sum" style="margin:8px 0 0"><span id="pstat"></span><span id="pexam"></span></div>
  </div>
  <div class="wl" id="wl"></div>
 </section>
</main>
<script>
var BLOCKS=[
 {s:450,t:"Wake up & Morning Buffer",n:"Hydrate, sunlight, no screens.",k:"rest"},
 {s:495,t:"Freshen up & Breakfast",n:"",k:""},
 {s:540,t:"Job Applications",n:"Submit tailored applications for Treasury, FP&A, and Financial Analyst roles.",k:"focus"},
 {s:660,t:"Screen-Free Reset",n:"Step away from desk completely.",k:"rest"},
 {s:690,t:"Deep Work Block 1",n:"BMC / BIDA Concepts.",k:"focus"},
 {s:780,t:"Lunch & Reset",n:"",k:""},
 {s:840,t:"Deep Work Block 2",n:"SQL Syntax & Active Practice.",k:"focus"},
 {s:930,t:"Rest + Breathe",n:"90 minutes to completely decompress.",k:"rest"},
 {s:1020,t:"Meeting",n:"",k:""},
 {s:1080,t:"Head to Work",n:"",k:""},
 {s:1380,t:"Home + Sleep",n:"Wind down, no tech.",k:"rest"}
];
var WEEKS=[{"t": "Quick Wins & SQL Basics", "d": [{"n": "Mon", "x": "BMC Equities/Fixed Income & SQL SELECT, FROM, WHERE"}, {"n": "Tue", "x": "BMC Currencies/Portfolio & SQL Filtering/Sorting"}, {"n": "Wed", "x": "Claim BMC Certificate & SQL Aggregate Functions"}, {"n": "Thu", "x": "BIDA Intro Concepts & SQL Basic JOINs"}, {"n": "Fri", "x": "BIDA Relational Data & SQL Multiple JOINs"}, {"n": "Sat", "x": "Set up local SQL env & write active database queries (2 hrs)"}]}, {"t": "Advanced SQL Mastery", "d": [{"n": "Mon", "x": "SQL Subqueries (Theory & Practice)"}, {"n": "Tue", "x": "SQL CTEs (Theory & Practice)"}, {"n": "Wed", "x": "SQL Window Functions Intro (Theory & Practice)"}, {"n": "Thu", "x": "SQL Advanced Window Functions (Theory & Practice)"}, {"n": "Fri", "x": "SQL Data Cleaning Methods"}, {"n": "Sat", "x": "Clean and structure a messy dataset using pure SQL"}]}, {"t": "Data Modeling (Power Query)", "d": [{"n": "Mon", "x": "Power Query Interface & Importing Data"}, {"n": "Tue", "x": "Transforming Columns & Handling Nulls/Errors"}, {"n": "Wed", "x": "Merging & Appending Tables in PQ"}, {"n": "Thu", "x": "Star Schema Concepts: Fact vs Dimension Tables"}, {"n": "Fri", "x": "Modeling Relationships & Cross-filtering"}, {"n": "Sat", "x": "Build a clean, functioning data model with multiple tables"}]}, {"t": "Power BI Visuals", "d": [{"n": "Mon", "x": "Power BI Desktop Intro & Basic Charts"}, {"n": "Tue", "x": "Formatting Visuals & Conditional Formatting"}, {"n": "Wed", "x": "Slicers, Filters, & Sync Slicers"}, {"n": "Thu", "x": "Drill-through, Tooltips, & Page Navigation"}, {"n": "Fri", "x": "Bookmarks, Buttons, & Interactive Reporting"}, {"n": "Sat", "x": "Draft a basic interactive report from your modeled data"}]}, {"t": "DAX Logic", "d": [{"n": "Mon", "x": "Calculated Columns vs Measures & Basic Math"}, {"n": "Tue", "x": "Filter Context Explained (SUMX vs SUM)"}, {"n": "Wed", "x": "The CALCULATE function & modifying context"}, {"n": "Thu", "x": "Time Intelligence Intro (YTD, MTD, YoY)"}, {"n": "Fri", "x": "Date Tables & Advanced Time Intelligence"}, {"n": "Sat", "x": "Practice variance analysis & KPI generation using DAX"}]}, {"t": "Project 1: Financial Dashboard", "d": [{"n": "Mon", "x": "Scope project & Load Treasury/Cash Flow data in PQ"}, {"n": "Tue", "x": "Build Financial Data Model & Date Table"}, {"n": "Wed", "x": "Write DAX for Revenue, AP, AR, & Working Capital"}, {"n": "Thu", "x": "Write DAX for Bank Reconciliation & Variance"}, {"n": "Fri", "x": "Build Visuals & Format Executive Layout"}, {"n": "Sat", "x": "Polish dashboard layout and test cross-filtering"}]}, {"t": "PL-300 Prep (Data & Model)", "d": [{"n": "Mon", "x": "MS Learn: Prepare Data & Practice Questions"}, {"n": "Tue", "x": "MS Learn: Clean/Transform Data & Practice Questions"}, {"n": "Wed", "x": "MS Learn: Design Model & Practice Questions"}, {"n": "Thu", "x": "MS Learn: Optimize Model & Practice Questions"}, {"n": "Fri", "x": "MS Learn: DAX Calculations & Practice Questions"}, {"n": "Sat", "x": "Take a baseline PL-300 practice exam"}]}, {"t": "PL-300 Prep (Visuals & Workspaces)", "d": [{"n": "Mon", "x": "MS Learn: Create Reports & Usability"}, {"n": "Tue", "x": "MS Learn: Manage Workspaces & Datasets"}, {"n": "Wed", "x": "MS Learn: Row-Level Security (RLS)"}, {"n": "Thu", "x": "Review weak domains from previous mock exam"}, {"n": "Fri", "x": "Full PL-300 Mock Exam 1"}, {"n": "Sat", "x": "Review incorrect mock exam answers"}]}, {"t": "Project 2: Macroeconomic Dashboard", "d": [{"n": "Mon", "x": "Gather FRED Data (Inflation, Yields) & Load to BI"}, {"n": "Tue", "x": "Model Economic Data & Write DAX for Macro Trends"}, {"n": "Wed", "x": "Build Treasury Yield Curve & Interest Rate Visuals"}, {"n": "Thu", "x": "Build Inflation/Unemployment Tracking"}, {"n": "Fri", "x": "Final Formatting & Tooltip additions"}, {"n": "Sat", "x": "Finalize the macroeconomic dashboard for portfolio"}]}, {"t": "Execution & Certification", "d": [{"n": "Mon", "x": "Final DAX & Model Review"}, {"n": "Tue", "x": "Final Workspace & Security Review"}, {"n": "Wed", "x": "Relax & Light Exam Review"}, {"n": "Thu", "x": "SIT FOR THE PL-300 EXAM"}, {"n": "Fri", "x": "Add credentials to Resume & LinkedIn"}, {"n": "Sat", "x": "Celebrate & apply for Data/Treasury Analyst roles!"}]}];
var openW={};
var mem={};
function sget(k,d){try{var v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d}
function sset(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var $=function(id){return document.getElementById(id)};
function pad(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
function fmt(d){return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function hm(m){m=m%1440;var h=Math.floor(m/60),mm=m%60,ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+pad(mm)+" "+ap}

function tab(id){
 ["routine","plan"].forEach(function(t){$(t).classList.toggle("on",t===id);$("t-"+t).setAttribute("aria-selected",t===id)});
 sset("tab",id);
}

/* ---------- Routine ---------- */
function curIndex(min){
 if(min<BLOCKS[0].s)return BLOCKS.length-1; // still in last night's sleep block
 for(var i=BLOCKS.length-1;i>=0;i--)if(min>=BLOCKS[i].s)return i;
 return 0;
}
function renderRoutine(){
 var now=new Date(),min=now.getHours()*60+now.getMinutes(),ci=curIndex(min),today=iso(now);
 var done=sget("done-"+today,{}),n=0;
 var html="";
 BLOCKS.forEach(function(b,i){
  var cls="it "+b.k+(i===ci?" cur":"")+((i<ci&&min>=BLOCKS[0].s)?" past":"");
  var on=done[i]?"checked":"";if(done[i])n++;
  html+='<li class="'+cls+'"><div class="tx"><div class="tm">'+hm(b.s)+(i===ci?'<span class="badge">Now</span>':"")+'</div><div class="tt">'+b.t+'</div>'+(b.n?'<div class="tn">'+b.n+'</div>':"")+'</div><input type="checkbox" class="ck" aria-label="Mark '+b.t+' done" data-i="'+i+'" '+on+'></li>';
 });
 $("tl").innerHTML=html;
 $("dcount").textContent=n+"/"+BLOCKS.length+" done";
 var b=BLOCKS[ci],nx=BLOCKS[(ci+1)%BLOCKS.length];
 var st=b.s,en=ci===BLOCKS.length-1?BLOCKS[0].s+1440:nx.s,m=min<BLOCKS[0].s&&ci===BLOCKS.length-1?min+1440:min;
 var pct=Math.max(0,Math.min(100,(m-st)/(en-st)*100)),left=en-m;
 $("now").innerHTML='<small>Right now</small><b>'+b.t+'</b><small>'+(left>=60?Math.floor(left/60)+" hr "+(left%60)+" min":left+" min")+' left · next: '+nx.t+' at '+hm(nx.s)+'</small><div class="bar"><i style="width:'+pct+'%"></i></div>';
}
$("tl").addEventListener("change",function(e){
 var i=e.target.getAttribute("data-i");if(i===null)return;
 var k="done-"+iso(new Date()),d=sget(k,{});
 if(e.target.checked)d[i]=1;else delete d[i];
 sset(k,d);renderRoutine();
});

/* ---------- Plan ---------- */
function startDate(){var s=sget("start",null);if(!s){s=iso(new Date());sset("start",s)}return parse(s)}
function renderPlan(){
 var st=startDate(),today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());
 var diff=Math.floor((today-st)/86400000),cw=diff<0?0:Math.floor(diff/7)+1;
 var prog=sget("days",{}),total=0,done=0,html="";
 $("start").value=iso(st);
 WEEKS.forEach(function(w,i){
  var id=i+1,a=addDays(st,i*7),b=addDays(a,5),wd=0;
  var dh=w.d.map(function(d,di){
   var k="w"+id+"d"+di;total++;if(prog[k]){done++;wd++}
   return '<div class="day-item"><input type="checkbox" class="wk" aria-label="'+d.n+' week '+id+'" data-did="'+k+'" '+(prog[k]?"checked":"")+'><div class="day-text"><b>'+d.n+'</b>'+d.x+'</div></div>';
  }).join("");
  var full=wd===w.d.length,tag="";
  if(id===cw)tag='<span class="tag" style="background:var(--acc)">This week</span>';
  else if(cw>0&&id<cw&&!full)tag='<span class="tag" style="background:var(--warn)">Behind</span>';
  var open=(i in openW)?openW[i]:id===cw;
  html+='<details data-w="'+i+'" class="'+(full?"w-done":"")+'" '+(open?"open":"")+'><summary><div class="sum-left"><h3>Week '+id+tag+'</h3><p>'+w.t+'</p></div><div class="sum-right">'+wd+'/6 days<span>'+fmt(a)+' – '+fmt(b)+'</span></div></summary><div class="day-list">'+dh+'</div></details>';
 });
 $("wl").innerHTML=html;
 $("pbar").style.width=(Math.round(done/total*100)||0)+"%";
 $("pstat").textContent=done+"/"+total+" sprint days complete";
 var dl=Math.round((addDays(st,69)-today)/86400000);
 $("pexam").textContent=dl>0?"Sprint ends in "+dl+" days":dl===0?"Final day today":"Sprint ended "+fmt(addDays(st,69));
}
$("wl").addEventListener("toggle",function(e){var d=e.target;if(d.dataset&&d.dataset.w!==undefined)openW[d.dataset.w]=d.open},true);
$("wl").addEventListener("change",function(e){
 var k=e.target.getAttribute("data-did");if(!k)return;
 var p=sget("days",{});p[k]=e.target.checked;sset("days",p);renderPlan();
});
$("start").addEventListener("change",function(e){if(e.target.value){sset("start",e.target.value);renderPlan()}});

/* ---------- Clock ---------- */
function tick(){
 var d=new Date();
 $("clock").textContent=d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
 $("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
 renderRoutine();
 if(iso(d)!==tick.last){tick.last=iso(d);renderPlan()}
}
renderPlan();tick();tab(sget("tab","routine"));
setInterval(tick,30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});
</script>
</body>
</html>
